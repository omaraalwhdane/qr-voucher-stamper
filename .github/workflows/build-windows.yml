name: Build Windows EXE

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract
        run: |
          choco install tesseract --yes
          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Bundle Tesseract into project
        run: |
          Copy-Item -Recurse "C:\Program Files\Tesseract-OCR" -Destination "tesseract"
      - name: Install Python dependencies
        run: pip install pyinstaller Pillow "qrcode[pil]" pytesseract

      - name: Build EXE with PyInstaller
        run: pyinstaller "QR Voucher Stamper.spec"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: QR-Voucher-Stamper-Windows
          path: dist/QR Voucher Stamper.exe

      - name: Attach EXE to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QR Voucher Stamper.exe
